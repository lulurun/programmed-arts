<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Interactive Elliptical Fish Tessellation</title>
    <link rel="stylesheet" href="src/styles.css?v=20260731-rainbow">
  </head>
  <body>
    <main class="app">
      <section class="workspace" aria-label="Fish tessellation workspace">
        <article class="view view-editor page" id="patternPage">
          <div class="view-bar">
            <div>
              <p>Page 1 / Repeatable Pattern</p>
              <h1>Single Fish Module</h1>
            </div>
            <div class="metric" id="geometryMetric">0 intersections</div>
          </div>
          <canvas id="geometryCanvas" width="860" height="620" aria-label="Four ellipse geometry editor"></canvas>
        </article>

        <article class="view view-art page" id="artPage" hidden>
          <div class="view-bar">
            <div>
              <p>Page 2 / Final Artwork</p>
              <h1>Layout Renderer</h1>
            </div>
            <div class="metric" id="artMetric">0 modules</div>
          </div>
          <canvas id="artCanvas" width="1120" height="760" aria-label="Color tessellation renderer"></canvas>
        </article>
      </section>

      <aside class="panel" aria-label="Geometry and artwork controls">
        <div class="title-block">
          <p class="kicker">4 ellipses / mirrored arcs / periodic tiling</p>
          <h2>Fish Tessellation Lab</h2>
        </div>

        <div class="page-tabs" role="tablist" aria-label="Tool pages">
          <button id="patternPageButton" class="is-active" type="button">Pattern</button>
          <button id="artPageButton" type="button">Artwork</button>
        </div>

        <div id="patternPanel">
          <section class="control-section">
            <h3>Pattern Parts</h3>
            <div class="ellipse-tabs" id="ellipseTabs" role="tablist" aria-label="Ellipse selector"></div>
            <div id="ellipseControls"></div>
          </section>

          <section class="control-section">
            <h3>Geometry View</h3>
            <div class="toggles">
              <label class="check">
                <input id="showGuides" type="checkbox" checked>
                <span>Guides</span>
              </label>
              <label class="check">
                <input id="showFullEllipses" type="checkbox" checked>
                <span>Full ellipses</span>
              </label>
            </div>
          </section>

          <section class="control-section">
            <h3>Server Pattern</h3>
            <label>
              <span>Pattern name</span>
              <input id="patternName" type="text" value="Pattern 1">
            </label>
            <button id="savePatternButton" type="button">Save Pattern</button>
            <div class="save-status" id="patternSaveStatus" aria-live="polite"></div>
          </section>
        </div>

        <div id="artPanel" hidden>
          <section class="control-section">
            <h3>Layout</h3>
            <div class="control-grid" id="layoutControls"></div>
          </section>

          <section class="control-section">
            <h3>Color</h3>
            <label class="check">
              <input id="colorEnabled" type="checkbox">
              <span>Color</span>
            </label>
            <div class="segmented" id="paletteControls" aria-label="Palette presets" hidden></div>
            <div class="segmented" id="styleControls" aria-label="Coloring styles" hidden></div>
          </section>
        </div>

        <section class="control-section">
          <h3 id="readoutTitle">Calculated Geometry</h3>
          <div class="readout" id="readout"></div>
        </section>

        <div class="actions">
          <button id="resetPatternButton" class="secondary" type="button">Reset Pattern</button>
          <button id="resetLayoutButton" class="secondary" type="button" hidden>Reset Layout</button>
          <button id="exportSvgButton" type="button">Export SVG</button>
          <button id="exportPngButton" type="button">Export PNG</button>
        </div>
      </aside>
    </main>

    <script src="src/art.js?v=20260731-rainbow"></script>
  </body>
</html>
