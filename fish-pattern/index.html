<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Interactive Elliptical Fish Tessellation</title>
    <link rel="stylesheet" href="src/styles.css">
  </head>
  <body>
    <main class="app">
      <section class="workspace" aria-label="Fish tessellation workspace">
        <article class="view view-editor">
          <div class="view-bar">
            <div>
              <p>Geometry Editor</p>
              <h1>Parametric Fish</h1>
            </div>
            <div class="metric" id="geometryMetric">0 intersections</div>
          </div>
          <canvas id="geometryCanvas" width="860" height="620" aria-label="Four ellipse geometry editor"></canvas>
        </article>

        <article class="view view-art">
          <div class="view-bar">
            <div>
              <p>Artwork Renderer</p>
              <h1>Tessellated Pattern</h1>
            </div>
            <div class="metric" id="artMetric">0 modules</div>
          </div>
          <canvas id="artCanvas" width="1120" height="760" aria-label="Color tessellation renderer"></canvas>
        </article>
      </section>

      <aside class="panel" aria-label="Geometry and artwork controls">
        <div class="title-block">
          <p class="kicker">4 ellipses / mirrored arcs / periodic tiling</p>
          <h2>Fish Tessellation Lab</h2>
        </div>

        <section class="control-section">
          <h3>Module</h3>
          <div class="control-grid" id="moduleControls"></div>
        </section>

        <section class="control-section">
          <h3>Ellipses</h3>
          <div class="ellipse-tabs" id="ellipseTabs" role="tablist" aria-label="Ellipse selector"></div>
          <div id="ellipseControls"></div>
        </section>

        <section class="control-section">
          <h3>Artwork</h3>
          <div class="segmented" id="paletteControls" aria-label="Palette presets"></div>
          <div class="segmented" id="styleControls" aria-label="Coloring styles"></div>
          <div class="toggles">
            <label class="check">
              <input id="showGuides" type="checkbox" checked>
              <span>Guides</span>
            </label>
            <label class="check">
              <input id="showFullEllipses" type="checkbox" checked>
              <span>Full ellipses</span>
            </label>
          </div>
        </section>

        <section class="control-section">
          <h3>Calculated Geometry</h3>
          <div class="readout" id="readout"></div>
        </section>

        <div class="actions">
          <button id="resetButton" class="secondary" type="button">Reset</button>
          <button id="exportSvgButton" type="button">Export SVG</button>
          <button id="exportPngButton" type="button">Export PNG</button>
        </div>
      </aside>
    </main>

    <script src="src/art.js"></script>
  </body>
</html>
